# GitQuest — nginx site config for the static export.
#
# Install on the server as /etc/nginx/sites-available/gitquest, symlink it into sites-enabled,
# then run certbot, which rewrites this file to add the TLS server block and the HTTP->HTTPS redirect.
# Replace example.com with your own domain before installing.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/gitquest;
    index index.html;

    # Security headers. NOTE: nginx only inherits add_header into a location that declares no add_header
    # of its own — so if you ever add one to a location below, repeat these there too or they silently vanish.
    # The inline appearance script in src/app/layout.tsx is why script-src needs 'unsafe-inline'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Build assets carry a content hash in the filename, so a given URL never changes: cache them hard.
    location /_next/static/ {
        expires 1y;
    }

    # The export writes /play/start-tracking.html, so $uri.html is what makes the clean URL resolve.
    # expires -1 keeps pages revalidating, or readers stay on the previous build after a deploy.
    location / {
        try_files $uri $uri.html $uri/index.html /404.html;
        expires -1;
    }

    error_page 404 /404.html;
}
